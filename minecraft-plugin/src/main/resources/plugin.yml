name: MCQQAuth
version: 0.5.0
main: cn.nightbugclub.mcqqauth.MCQQAuthPlugin
api-version: '1.20'
description: Minecraft QQ Community Authentication
softdepend: [AuthMe]

commands:
  mcqqauth:
    description: Show MCQQAuth status, manage authorization mode, or reload the sudo allowlist
    usage: /mcqqauth [mode [observe|enforce [--kick-online]]|sudo reload]
    permission: mcqqauth.admin

permissions:
  mcqqauth.admin:
    description: MCQQAuth administration
    default: op
