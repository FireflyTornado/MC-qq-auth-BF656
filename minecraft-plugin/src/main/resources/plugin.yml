name: MCQQAuth
version: 0.4.1
main: cn.nightbugclub.mcqqauth.MCQQAuthPlugin
api-version: '1.20'
description: Minecraft QQ Community Authentication
softdepend: [AuthMe]

commands:
  mcqqauth:
    description: Show MCQQAuth status or manage authorization mode
    usage: /mcqqauth [mode [observe|enforce [--kick-online]]]
    permission: mcqqauth.admin

permissions:
  mcqqauth.admin:
    description: MCQQAuth administration
    default: op
