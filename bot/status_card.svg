<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="720" height="640" viewBox="0 0 720 640" font-family="$font_family" fill="#edf5f6">
  <defs>
    <clipPath id="avatar-clip"><circle cx="76" cy="122" r="27"/></clipPath>
    <linearGradient id="binding-fill" x2="1" y2="1">
      <stop stop-color="#183c3a"/>
      <stop offset="1" stop-color="#1a2935"/>
    </linearGradient>
  </defs>
  <rect width="720" height="640" fill="#101923"/>
  <rect x="24" y="22" width="38" height="38" rx="10" fill="#203a3b" stroke="#35514f"/>
  <path d="M43 28l11 6v13l-11 6-11-6V34z M32 34l11 6 11-6 M43 40v13"
        fill="none" stroke="#7ae7c2" stroke-width="1.4" stroke-linejoin="round"/>
  <text id="title" x="74" y="50" font-size="29" font-weight="700">$title</text>
  <text x="696" y="47" text-anchor="end" font-size="16" fill="#a8bbcb">$page_label</text>

  <g id="account">
    <rect x="24" y="76" width="362" height="126" rx="16" fill="#192632" stroke="#2b3d4b"/>
    <g transform="translate(0 2)">
      <circle cx="76" cy="120" r="28" fill="#264247" stroke="#3e605f"/>
      <path d="M76 103v6 M69 128h14" stroke="#7ae7c2" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="61" y="110" width="30" height="21" rx="5" fill="#173239" stroke="#7ae7c2"/>
      <circle cx="71" cy="119" r="2" fill="#7ae7c2"/><circle cx="81" cy="119" r="2" fill="#7ae7c2"/>
    </g>
    <image id="avatar" x="49" y="95" width="54" height="54" clip-path="url(#avatar-clip)"
           display="$avatar_display" xlink:href="$avatar"/>
    <circle cx="96" cy="142" r="6" fill="$account_color" stroke="#192632" stroke-width="2"/>
    <text id="nickname" x="121" y="119" font-size="23" font-weight="700">$nickname</text>
    <text id="qq-id" x="121" y="145" font-size="16" fill="#a8bbcb">$qq</text>
    <path d="M44 160H366" stroke="#2b3d4b"/>
    <text x="44" y="185" font-size="14" fill="#a8bbcb">$timestamp_label</text>
    <text id="timestamp" x="366" y="185" text-anchor="end" font-size="14" fill="#edf5f6">$timestamp</text>
  </g>

  <g id="bindings">
    <rect x="24" y="214" width="362" height="90" rx="16" fill="url(#binding-fill)" stroke="#35514f"/>
    <text id="bindings-label" x="44" y="266" font-size="19" fill="#d1e8e5">$bindings_label</text>
    <text id="bindings-count" x="366" y="280" text-anchor="end" font-size="$bindings_size" font-weight="700" fill="#7ae7c2">$bindings_count</text>
  </g>

  <g id="resources">
    <rect x="24" y="316" width="362" height="300" rx="16" fill="#192632" stroke="#2b3d4b"/>
    <text id="resources-label" x="44" y="351" font-size="19" font-weight="700">$resources_label</text>
    <text id="system-uptime" x="366" y="351" text-anchor="end" font-size="14" fill="#a8bbcb">$system_uptime</text>
    <text id="system" x="44" y="378" font-size="15" fill="#a8bbcb">$system</text>
    <path d="M44 394H366" stroke="#2b3d4b"/>
    <g id="cpu">
      <text x="44" y="428" font-size="16" font-weight="700">CPU</text>
      <text id="cpu-value" x="366" y="428" text-anchor="end" font-size="18" font-weight="700">$cpu_value</text>
      <text id="cpu-detail" x="44" y="448" font-size="14" fill="#a8bbcb">$cpu_detail</text>
      <rect x="44" y="457" width="$meter_width" height="6" rx="3" fill="#2c4250"/>
      <rect x="44" y="457" width="$cpu_bar" height="6" rx="3" fill="$cpu_color"/>
    </g>
    <g id="memory" transform="translate(0 61)">
      <text x="44" y="428" font-size="16" font-weight="700">$memory_label</text>
      <text id="memory-value" x="366" y="428" text-anchor="end" font-size="18" font-weight="700">$memory_value</text>
      <text id="memory-detail" x="44" y="448" font-size="14" fill="#a8bbcb">$memory_detail</text>
      <rect x="44" y="457" width="$meter_width" height="6" rx="3" fill="#2c4250"/>
      <rect x="44" y="457" width="$memory_bar" height="6" rx="3" fill="$memory_color"/>
    </g>
    <g id="disk" transform="translate(0 122)">
      <text x="44" y="428" font-size="16" font-weight="700">$disk_label</text>
      <text id="disk-value" x="366" y="428" text-anchor="end" font-size="18" font-weight="700">$disk_value</text>
      <text id="disk-detail" x="44" y="448" font-size="14" fill="#a8bbcb">$disk_detail</text>
      <rect x="44" y="457" width="$meter_width" height="6" rx="3" fill="#2c4250"/>
      <rect x="44" y="457" width="$disk_bar" height="6" rx="3" fill="$disk_color"/>
    </g>
  </g>

  <g id="services">
    <rect x="400" y="76" width="296" height="540" rx="16" fill="#192632" stroke="#2b3d4b"/>
    <text x="422" y="111" font-size="20" font-weight="700">$services_label</text>
    <g id="onebot-link" stroke="$onebot_color">
      <path d="M495 221V281" stroke-width="2" stroke-dasharray="$onebot_dash"/>
      <text x="510" y="256" font-size="14" stroke="none" xml:space="preserve"><tspan id="onebot-name">$onebot_name</tspan><tspan fill="#a8bbcb">$onebot_separator</tspan><tspan id="onebot-uptime" fill="#a8bbcb">$onebot_uptime</tspan></text>
    </g>
    <g id="api-link" stroke="$api_color">
      <path d="M495 333V393" stroke-width="2" stroke-dasharray="$api_dash"/>
      <text id="api-status" x="510" y="368" font-size="14" stroke="none" fill="$api_color">$api_status</text>
    </g>
    <g id="wss-link" stroke="$wss_color">
      <path d="M495 445V505" stroke-width="2" stroke-dasharray="$wss_dash"/>
      <text x="510" y="480" font-size="14" stroke="none">WSS</text>
    </g>
    <g id="sqlite-link" stroke="$sqlite_color">
      <path d="M558 419H579" stroke-width="2" stroke-dasharray="$sqlite_dash"/>
      <rect x="579" y="404" width="95" height="30" rx="7" fill="#182833"/>
      <text id="sqlite-name" x="626.5" y="424" text-anchor="middle" font-size="13" stroke="none">$sqlite_name</text>
    </g>
    <g text-anchor="middle">
      <rect x="432" y="169" width="126" height="52" rx="9" fill="#20323e" stroke="#3a505d"/>
      <text x="495" y="201" font-size="16" font-weight="700">NapCat</text>
      <rect x="432" y="281" width="126" height="52" rx="9" fill="#20323e" stroke="#3a505d"/>
      <text id="bot-name" x="495" y="304" font-size="16" font-weight="700">$bot_name</text>
      <text id="bot-uptime" x="495" y="324" font-size="13" fill="#a8bbcb">$bot_uptime</text>
      <rect x="432" y="393" width="126" height="52" rx="9" fill="#20323e" stroke="#3a505d"/>
      <text id="api-name" x="495" y="425" font-size="16" font-weight="700">$api_name</text>
      <rect id="minecraft-node" x="432" y="505" width="126" height="52" rx="9" fill="#20323e"
            stroke="$minecraft_color" stroke-dasharray="$minecraft_dash"/>
      <text x="495" y="$minecraft_title_y" font-size="16" font-weight="700">Minecraft</text>
      <text id="minecraft-players" x="495" y="548" font-size="13" fill="#a8bbcb">$minecraft_players</text>
    </g>
  </g>
</svg>
